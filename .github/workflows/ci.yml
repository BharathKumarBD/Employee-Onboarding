name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Unit Tests & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r evals/requirements.txt

      - name: Python Syntax & Compilation Verification
        run: |
          python -c "
          import py_compile, pathlib, sys
          files = list(pathlib.Path('.').glob('**/*.py'))
          files = [f for f in files if 'node_modules' not in str(f) and '.venv' not in str(f)]
          for f in files:
              py_compile.compile(str(f), doraise=True)
          print(f'All {len(files)} Python files compiled successfully!')
          "

      - name: Run Unit Tests
        run: |
          python tests/test_improvements.py

  test-frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Lint & Build
        working-directory: frontend
        run: |
          npm run lint
          npm run build

